```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manchivadu Ante Nani</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background:
            radial-gradient(circle at center, #2a2108 0%, #080808 45%, #000 100%);
        font-family: Arial, Helvetica, sans-serif;
    }

    /* Golden light background */
    .gold-light {
        position: absolute;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: radial-gradient(
            circle,
            rgba(255, 215, 70, 0.35),
            rgba(255, 180, 0, 0.12),
            transparent 70%
        );
        filter: blur(30px);
        animation: lightPulse 3s ease-in-out infinite;
    }

    @keyframes lightPulse {
        0%, 100% {
            transform: scale(0.8);
            opacity: 0.5;
        }

        50% {
            transform: scale(1.2);
            opacity: 1;
        }
    }

    /* Main container */
    .intro {
        position: relative;
        text-align: center;
        z-index: 5;
    }

    /* Small top text */
    .small-text {
        color: #e6c45c;
        font-size: 14px;
        letter-spacing: 8px;
        text-transform: uppercase;
        margin-bottom: 18px;

        opacity: 0;
        transform: translateY(20px);

        animation: fadeUp 1.2s ease forwards;
        animation-delay: 0.3s;
    }

    /* Main golden name */
    .name {
        position: relative;
        font-size: clamp(55px, 12vw, 150px);
        font-weight: 900;
        letter-spacing: 8px;
        text-transform: uppercase;

        background: linear-gradient(
            120deg,
            #6b4b00,
            #ffd700,
            #fff3a0,
            #d4af37,
            #fff1a3,
            #8c6500
        );

        background-size: 300% auto;

        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;

        animation:
            revealName 1.8s cubic-bezier(.16,1,.3,1) forwards,
            goldMove 3s linear infinite;

        filter:
            drop-shadow(0 0 8px rgba(255,215,0,.7))
            drop-shadow(0 0 30px rgba(255,180,0,.4));

        opacity: 0;
    }

    /* Golden shine moving across text */
    .name::after {
        content: "";
        position: absolute;
        top: 0;
        left: -120%;
        width: 60%;
        height: 100%;

        background: linear-gradient(
            100deg,
            transparent,
            rgba(255,255,255,.8),
            transparent
        );

        transform: skewX(-20deg);

        animation: shine 2.5s ease-in-out 1.5s infinite;
    }

    /* Subtitle */
    .subtitle {
        margin-top: 25px;

        color: #fff;
        font-size: clamp(18px, 3vw, 30px);
        letter-spacing: 6px;
        font-weight: 500;

        opacity: 0;
        transform: translateY(30px);

        animation: fadeUp 1.2s ease forwards;
        animation-delay: 1.4s;

        text-shadow:
            0 0 10px rgba(255,215,0,.6);
    }

    /* Decorative golden line */
    .line {
        width: 0;
        height: 2px;
        margin: 30px auto 0;

        background: linear-gradient(
            90deg,
            transparent,
            #ffd700,
            #fff3a0,
            #ffd700,
            transparent
        );

        box-shadow: 0 0 15px #ffd700;

        animation: lineReveal 1.5s ease forwards;
        animation-delay: 1.8s;
    }

    /* Floating particles */
    .particle {
        position: absolute;
        width: 4px;
        height: 4px;

        background: #ffd700;
        border-radius: 50%;

        box-shadow: 0 0 10px #ffd700;

        animation: floatParticle linear infinite;
    }

    @keyframes revealName {
        0% {
            opacity: 0;
            transform:
                translateY(80px)
                scale(.65);
            filter:
                blur(18px)
                drop-shadow(0 0 0 transparent);
        }

        60% {
            opacity: 1;
        }

        100% {
            opacity: 1;
            transform:
                translateY(0)
                scale(1);
            filter:
                blur(0)
                drop-shadow(0 0 8px rgba(255,215,0,.8))
                drop-shadow(0 0 35px rgba(255,180,0,.5));
        }
    }

    @keyframes goldMove {
        0% {
            background-position: 0% 50%;
        }

        100% {
            background-position: 300% 50%;
        }
    }

    @keyframes shine {
        0% {
            left: -120%;
        }

        45%, 100% {
            left: 150%;
        }
    }

    @keyframes fadeUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes lineReveal {
        to {
            width: min(500px, 70vw);
        }
    }

    @keyframes floatParticle {
        0% {
            transform:
                translateY(110vh)
                translateX(0)
                scale(0);
            opacity: 0;
        }

        20% {
            opacity: 1;
        }

        80% {
            opacity: 1;
        }

        100% {
            transform:
                translateY(-20vh)
                translateX(100px)
                scale(1.5);
            opacity: 0;
        }
    }

    /* Mobile */
    @media(max-width:600px) {

        .name {
            letter-spacing: 3px;
        }

        .small-text {
            letter-spacing: 4px;
        }

        .subtitle {
            letter-spacing: 3px;
        }
    }

    /* Accessibility */
    @media(prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
        }
    }
</style>
</head>

<body>

<!-- Golden glow -->
<div class="gold-light"></div>

<!-- Floating particles -->
<div class="particle" style="left:10%; animation-duration:7s; animation-delay:0s;"></div>
<div class="particle" style="left:20%; animation-duration:9s; animation-delay:2s;"></div>
<div class="particle" style="left:35%; animation-duration:6s; animation-delay:1s;"></div>
<div class="particle" style="left:50%; animation-duration:8s; animation-delay:3s;"></div>
<div class="particle" style="left:65%; animation-duration:7s; animation-delay:1s;"></div>
<div class="particle" style="left:80%; animation-duration:10s; animation-delay:4s;"></div>
<div class="particle" style="left:90%; animation-duration:6s; animation-delay:2s;"></div>

<!-- Intro -->
<div class="intro">

    <div class="small-text">
        Welcome
    </div>

    <div class="name">
        NANI
    </div>

    <div class="subtitle">
        MANCHIVADU ANTE NANI
    </div>

    <div class="line"></div>

</div>

</body>
</html>
